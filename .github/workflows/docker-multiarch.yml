name: Docker multi-arch image (amd64 + arm64)

# Manual build of the web image for x86 servers (Contabo/Coolify) and ARM servers (Oracle Cloud Ampere A1).
# NEXT_PUBLIC_* values are baked in at build time: store them as one multi-line repository variable
# `WEB_BUILD_ARGS` (KEY=value per line), never as committed files.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ inputs.tag }}
          build-args: ${{ vars.WEB_BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
